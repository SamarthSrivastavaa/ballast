[workspace]
resolver = "2"

# §15's members, added as their slices landed so `cargo test` stayed meaningful and green.
# crates/floor needs no network and no Anchor, so it came first (§33). tests/fuzz is the §14 model
# fuzzer; crates/floor-wasm the floor crate for WebAssembly; verifier/ the `ballast` CLI (§20).
members = [
  "crates/floor",
  "crates/floor-wasm",
  "crates/meteora-types",
  "crates/verifier-core",
  "programs/ballast",
  "tests/fuzz",
  "verifier",
]
# The toolchain probe is its own workspace: it pulls the whole Anchor/Solana tree, which
# should not be resolved here while the P0 gate is closed.
exclude = ["tests/toolchain-probe"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"

[workspace.dependencies]
ruint = { version = "=1.12.3", default-features = false }

[profile.release]
overflow-checks = true    # §12: an arithmetic bug must panic, never wrap silently
lto = "fat"
codegen-units = 1

# D-007 / D-009: the program is size-optimised. Per-package so crates/floor's host tests and the
# property gate keep opt-level 3. (overflow-checks, lto and codegen-units above still apply.)
[profile.release.package.ballast]
opt-level = "z"

[profile.test]
overflow-checks = true
