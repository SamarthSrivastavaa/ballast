[package]
name = "ballast"
description = "The Ballast program: class verification, launch registry, prediction record, vault, floor, bids, redemption, burns, fee routing (§3, §6)."
version = "0.1.0"
edition = "2021"
# NOT the host pin. Compiled for SBF by platform-tools rustc 1.79 (Finding T1), and this value
# drives the MSRV-aware resolution that the STEP 2 lockfile method depends on (D-002).
rust-version = "1.79"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "ballast"

[features]
# D-018: drop Anchor's on-chain IDL instructions (the IDL is still generated off-chain by
# `anchor build` via idl-build and committed under target/idl for the clients).
default = ["no-idl"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# Exact pins: a caret lets anchor-lang drift to 0.31.2 and solana-program to 2.3.0, off the §16
# Agave 2.1.x line (DECISIONS § Toolchain, findings T2-T8).
anchor-lang = "=0.31.1"
# §4 rule 1: only ballast-floor computes F.
ballast-floor = { path = "../../crates/floor" }
# Vendored Meteora layouts, proven field-for-field against real accounts (Q12).
meteora-types = { path = "../../crates/meteora-types" }
# §7 curve capacity needs 256-bit products. Already proven SBF-clean (D-002 condition 3).
ruint = { workspace = true }

[dev-dependencies]
# Host-only test dependencies (never compiled for SBF; check_lock.py skips dev deps).
serde_json = "1"
bytemuck = "1"

[lints.rust]
unsafe_code = "forbid"
