<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ballast — cold open</title><style>html,body{margin:0;height:100%;background:#0e0e0d;color:#f4f2eb;font-family:"Inter","Helvetica Neue","Segoe UI",Arial,sans-serif;overflow:hidden}.stage{width:1920px;height:1080px;position:relative;transform-origin:0 0}.mark{position:absolute;left:120px;top:96px;font-weight:800;font-size:34px;letter-spacing:.14em}.mark i{display:inline-block;width:10px;height:30px;margin-right:16px;vertical-align:-4px;background:linear-gradient(#2a3fe0 0 55%,#f4f2eb 55% 100%)}h1{position:absolute;left:120px;right:120px;top:50%;transform:translateY(-50%);margin:0;font-size:124px;line-height:1.02;letter-spacing:-.03em;font-weight:700}h1 span{color:#8f8c82}.sub{position:absolute;left:120px;bottom:110px;font:28px ui-monospace,"Cascadia Mono",Consolas,monospace;color:#8f8c82;letter-spacing:.06em}</style><script>addEventListener("load",()=>{const s=document.querySelector(".stage"),f=()=>{const k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`scale(${k})`};f();addEventListener("resize",f)})</script></head><body><div class="stage"><div class="mark"><i></i>BALLAST</div><canvas id="c" width="1920" height="1080" style="position:absolute;inset:0"></canvas><h1 style="top:auto;bottom:190px;transform:none;font-size:96px">Most launches have no bottom.</h1><script>
// A generic price line: it climbs, then falls to zero. No real token; the shape is drawn, not data.
const g=document.getElementById("c").getContext("2d"),pts=[];for(let i=0;i<=240;i++){const t=i/240;const up=t<.42?Math.pow(t/.42,1.6):Math.max(0,1-Math.pow((t-.42)/.5,.55));pts.push([180+t*1560,640-up*420*(1+.05*Math.sin(i*1.3))])}
let n=0;(function tick(){g.clearRect(0,0,1920,1080);g.strokeStyle="#34332f";g.lineWidth=1;g.beginPath();g.moveTo(180,640);g.lineTo(1740,640);g.stroke();g.strokeStyle="#f4f2eb";g.lineWidth=3;g.beginPath();for(let i=0;i<=Math.min(n,240);i++){i?g.lineTo(...pts[i]):g.moveTo(...pts[i])}g.stroke();if(n<240){n+=1.2;requestAnimationFrame(tick)}})();
addEventListener("keydown",e=>{if(e.code==="Space")location.reload()})</script></div></body></html>
