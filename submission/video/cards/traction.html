<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ballast — traction</title><style>html,body{margin:0;height:100%;background:#0e0e0d;color:#f4f2eb;font-family:"Inter","Helvetica Neue","Segoe UI",Arial,sans-serif;overflow:hidden}.stage{width:1920px;height:1080px;position:relative;transform-origin:0 0}.mark{position:absolute;left:120px;top:96px;font-weight:800;font-size:34px;letter-spacing:.14em}.mark i{display:inline-block;width:10px;height:30px;margin-right:16px;vertical-align:-4px;background:linear-gradient(#2a3fe0 0 55%,#f4f2eb 55% 100%)}h1{position:absolute;left:120px;right:120px;top:50%;transform:translateY(-50%);margin:0;font-size:124px;line-height:1.02;letter-spacing:-.03em;font-weight:700}h1 span{color:#8f8c82}.sub{position:absolute;left:120px;bottom:110px;font:28px ui-monospace,"Cascadia Mono",Consolas,monospace;color:#8f8c82;letter-spacing:.06em}</style><script>addEventListener("load",()=>{const s=document.querySelector(".stage"),f=()=>{const k=Math.min(innerWidth/1920,innerHeight/1080);s.style.transform=`scale(${k})`};f();addEventListener("resize",f)})</script></head><body><div class="stage"><div class="mark"><i></i>BALLAST</div><div style="position:absolute;left:120px;right:120px;top:300px;display:grid;grid-template-columns:repeat(3,1fr);gap:60px"><div><div id="v" style="font-size:220px;font-weight:700;letter-spacing:-.04em;line-height:1">–</div><div class="lab">independent verifications</div></div><div><div id="l" style="font-size:220px;font-weight:700;letter-spacing:-.04em;line-height:1">–</div><div class="lab">launch requests</div></div><div><div id="b" style="font-size:220px;font-weight:700;letter-spacing:-.04em;line-height:1">–</div><div class="lab">break attempts</div></div></div><style>.lab{font:30px ui-monospace,"Cascadia Mono",Consolas,monospace;color:#8f8c82;letter-spacing:.06em;text-transform:uppercase;margin-top:18px}</style><div class="sub" id="when">COUNTED LIVE FROM GITHUB ISSUES · TEAM ACCOUNTS EXCLUDED BY HAND</div><script>
// Live counts from the public GitHub API: issues carrying each label. Nothing is typed in by hand.
// Subtract any issue opened by a team account before filming (see submission/TRACTION.md).
const q=(label,id)=>fetch("https://api.github.com/search/issues?q=repo:SamarthSrivastavaa/ballast+is:issue+label:"+label).then(r=>r.json()).then(j=>{document.getElementById(id).textContent=j.total_count??"?"}).catch(()=>{document.getElementById(id).textContent="?"});
q("verified","v");q("launch-request","l");q("break-attempt","b");document.getElementById("when").textContent+=" · "+new Date().toISOString().slice(0,16).replace("T"," ")+" UTC";</script></div></body></html>
