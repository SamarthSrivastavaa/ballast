[package]
name = "probe"
description = "Toolchain probe: proves crates/floor builds for SBF and is exact on-chain (D-002 cond. 3)."
version = "0.1.0"
edition = "2021"
# Compiled for SBF by platform-tools rustc 1.79 (Finding T1); also drives MSRV-aware resolution.
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "probe"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# Exact pins. A caret here let anchor-lang drift to 0.31.2 and solana-program to
# 2.3.0, whose blake3 -> digest 0.11 -> block-buffer 0.12.1 needs the edition2024
# manifest parser that platform-tools cargo (1.79.0) does not have.
anchor-lang = "=0.31.1"
# solana-program is deliberately NOT a direct dependency: anchor warns that it "might cause
# conflicts" and its IDL builder panics when it is. The §16 Agave 2.1.x line is held by an
# exact lockfile pin instead (cargo update -p solana-program --precise 2.1.21), which gives
# the same resolution without a second path to the crate.
# The whole point of the probe: this must compile for SBF under platform-tools rustc.
ballast-floor = { path = "../../../../crates/floor" }
