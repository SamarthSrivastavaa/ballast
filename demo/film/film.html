const SCENES = [
  ["cold", 8, cold], ["stat", 11, stat], ["title", 7, title], ["launch", 19, launch], ["mechanism", 31, mechanism], ["break", 3.5, breakIt],
  ["dump", 38, dump], ["verify", 26, verify], ["page", 9, page], ["limits", 11, limits], ["close", 10.5, close],
];
let acc = 0; const TL = SCENES.map(([id, dur, fn]) => { const s = { id, start: acc, end: acc + dur, fn }; acc += dur; return s; });
const TOTAL = acc;
const at = (id, a, b) => { const s = TL.find((x) => x.id === id); return [s.start + a * (s.end - s.start), s.start + b * (s.end - s.start)]; };
const CAPS = [

function frame(t) {
  A = 1; g.globalAlpha = 1; g.fillStyle = BG; g.fillRect(0, 0, W, H);
  const s = TL.find((x) => t >= x.start && t < x.end) ?? TL[TL.length - 1];
  const u = clamp((t - s.start) / (s.end - s.start));
  A = Math.min(1, (t - s.start) / 0.45, (s.end - t) / 0.35); if (s === TL[TL.length - 1]) A = Math.min(1, (t - s.start) / 0.45); A = clamp(A);
  s.fn(u);
  if (REPLAY.has(s.id)) tx(`REPLAY OF RUN ${D.runId}  ·  LOCAL VALIDATOR RUNNING METEORA'S MAINNET BINARIES  ·  EVERY LINE AND NUMBER IS RECORDED OUTPUT`, 100, 78, 19, DIM, { mono: true, spacing: "1.2px" });
  A = 1; g.globalAlpha = 1;
  const c = CAPS.find((x) => t >= x[0] && t < x[1]);
  if (c) {
    const a = clamp(Math.min((t - c[0]) / 0.3, (c[1] - t) / 0.3));
    g.font = `500 34px ${SANS}`; g.letterSpacing = "0px"; const w = Math.min(1760, g.measureText(c[2]).width + 56);
    g.globalAlpha = 0.82 * a; g.fillStyle = "#000"; g.fillRect((W - w) / 2, 972, w, 62);
    g.globalAlpha = a; g.fillStyle = INK; g.textAlign = "center"; g.fillText(c[2], W / 2, 1015, 1700); g.globalAlpha = 1;
  }
  g.fillStyle = ACCENT; g.fillRect(0, H - 4, W * (t / TOTAL), 4);
}

(async () => {
  D = await (await fetch("data.json")).json();
  PAGE = await new Promise((res) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = "page.png"; });
  await document.fonts.ready;
  if (q.get("at")) { frame(Number(q.get("at"))); document.title = "ready"; return; }
  let t0 = performance.now(), paused = false, held = 0;
  const now = () => (paused ? held : (performance.now() - t0) / 1000);
  if (q.get("record")) {
    const log = (m) => fetch("/log", { method: "POST", body: m }).catch(() => {});
    const type = ["video/mp4;codecs=avc1.640028", "video/mp4", "video/webm;codecs=vp9", "video/webm"].find((x) => MediaRecorder.isTypeSupported(x));
    const rec = new MediaRecorder(cv.captureStream(30), { mimeType: type, videoBitsPerSecond: 9e6 }), chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = async () => { const b = new Blob(chunks, { type }); await log(`recorded ${(b.size / 1e6).toFixed(1)} MB ${type} ${TOTAL}s`); await fetch(`/upload?name=ballast-demo.${type.includes("mp4") ? "mp4" : "webm"}`, { method: "POST", body: b }); };
    frame(0); rec.start(1000); t0 = performance.now();
    // A timer, not requestAnimationFrame: a headless or background tab may pause animation frames.
    const tick = setInterval(() => { const t = now(); frame(Math.min(t, TOTAL - 0.001)); if (t >= TOTAL + 0.8) { clearInterval(tick); rec.stop(); } }, 1000 / 30);
    let said = -1; setInterval(() => { const k = Math.floor(now() / 30); if (k !== said) { said = k; log(`recording ${Math.round(now())}s of ${Math.round(TOTAL)}s`); } }, 1000);
    return;
  }
  (function loop() { frame(Math.min(now(), TOTAL - 0.001)); requestAnimationFrame(loop); })();
  addEventListener("keydown", (e) => {
    if (e.code === "Space") { if (paused) { t0 = performance.now() - held * 1000; paused = false; } else { held = now(); paused = true; } }
    if (e.code === "ArrowRight" || e.code === "ArrowLeft") { const t = clamp(now() + (e.code === "ArrowRight" ? 5 : -5), 0, TOTAL); held = t; t0 = performance.now() - t * 1000; }
    if (e.key === "r") { t0 = performance.now(); held = 0; }
  });
})();
