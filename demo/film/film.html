<script>
// The demo film: 1920×1080, drawn on one canvas from data.json (demo/film/build.mjs assembles it
// from one recorded run; nothing shown is typed in by hand). It is a REPLAY of recorded output, and
// says so on screen.
//   film.html            play (space = pause, ←/→ = seek 5 s, r = restart)
//   film.html?at=42.5    one still frame at that second (for checking)
//   film.html?record=1   record the whole film with MediaRecorder and POST it to /upload
//   film.html?record=1&audio=vo.mp3   the same, with that audio file (in demo/film/) as the sound track
//   film.html?prompter=1 play with the voice-over lines on screen, to read along while recording your voice
const q = new URLSearchParams(location.search);
const cv = document.getElementById("c"), g = cv.getContext("2d");
const W = 1920, H = 1080;
const BG = "#0e0e0d", PANEL = "#171716", INK = "#f4f2eb", MUTED = "#9c998f", DIM = "#6b6962", RULE = "#34332f";
const BLUE = "#7c8cff", TEAL = "#3fbf9b", AMBER = "#e9a13b", RED = "#ff8a80", ACCENT = "#2a3fe0";
const SANS = '"Inter","Helvetica Neue","Segoe UI",Arial,sans-serif', MONO = '"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace';

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (u, a, b) => clamp((u - a) / (b - a));
const strip = (s) => s.replace(/\x1b\[[0-9;]*m/g, "");
function tx(s, x, y, size, color, o = {}) {
  g.font = `${o.weight ?? 400} ${size}px ${o.mono ? MONO : SANS}`;
  g.fillStyle = color; g.textAlign = o.align ?? "left"; g.globalAlpha = (o.alpha ?? 1) * A;
  if (o.spacing) g.letterSpacing = o.spacing; else g.letterSpacing = "0px";
  g.fillText(s, x, y); g.globalAlpha = A;
}
function wrap(s, x, y, size, color, maxW, lh, o = {}) {
  g.font = `${o.weight ?? 400} ${size}px ${o.mono ? MONO : SANS}`; g.letterSpacing = "0px";
  const words = s.split(" "); let line = "", yy = y;
  for (const w of words) { const t = line ? line + " " + w : w; if (g.measureText(t).width > maxW && line) { tx(line, x, yy, size, color, o); line = w; yy += lh; } else line = t; }
  if (line) tx(line, x, yy, size, color, o);
  return yy;
}
/** Run `fn` with everything it draws faded by `a`. */
function faded(a, fn) { const A0 = A; A = A0 * a; fn(); A = A0; g.globalAlpha = A; }
function rect(x, y, w, h, fill, stroke, lw = 1) { g.globalAlpha = A; if (fill) { g.fillStyle = fill; g.fillRect(x, y, w, h); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.strokeRect(x + 0.5, y + 0.5, w, h); } }

/** ANSI colour codes of the recorded terminal output → spans. */
function ansi(s) {
  const out = []; let color = INK, bold = false, dim = false, i = 0;
  const re = /\x1b\[([0-9;]*)m/g; let m;
  const push = (t) => { if (t) out.push({ t, color: dim ? DIM : color, bold }); };
  while ((m = re.exec(s))) {
    push(s.slice(i, m.index)); i = re.lastIndex;
    for (const c of m[1].split(";")) {
      if (c === "0" || c === "") { color = INK; bold = false; dim = false; }
      else if (c === "1") bold = true; else if (c === "2") dim = true;
      else if (c === "32") color = TEAL; else if (c === "33") color = AMBER; else if (c === "36") color = BLUE; else if (c === "31") color = RED;
    }
  }
  push(s.slice(i)); return out;
}
/** A terminal window: recorded lines, revealed up to `shown` (fractional = the last line typing). */
function terminal(x, y, w, h, title, lines, shown, o = {}) {
  const size = o.size ?? 22, lh = Math.round(size * 1.5), cols = Math.floor((w - 48) / (size * 0.6));
  rect(x, y, w, h, PANEL, RULE);
  rect(x, y, w, 44, "#1f1f1d");
  for (let i = 0; i < 3; i++) { g.fillStyle = ["#5a5852", "#5a5852", "#5a5852"][i]; g.globalAlpha = A; g.beginPath(); g.arc(x + 24 + i * 22, y + 22, 6, 0, 7); g.fill(); }
  tx(title, x + w / 2, y + 29, 18, MUTED, { mono: true, align: "center" });
  const rows = Math.floor((h - 44 - 28) / lh);
  const n = Math.min(lines.length, Math.ceil(shown));
  const first = Math.max(0, n - rows);
  g.save(); g.beginPath(); g.rect(x, y + 44, w, h - 44); g.clip();
  for (let k = first; k < n; k++) {
    let cx = x + 24; const yy = y + 44 + 34 + (k - first) * lh;
    const typing = k === n - 1 && shown < n ? shown - (n - 1) : 1;
    let budget = Math.floor(cols * (o.typing ? typing : 1)); let used = 0;
    for (const sp of ansi(lines[k])) {
      let t = sp.t; if (used + t.length > cols) t = t.slice(0, Math.max(0, cols - used - 1)) + "…";
      if (o.typing) t = t.slice(0, Math.max(0, budget)); budget -= t.length; used += t.length;
      g.font = `${sp.bold ? 700 : 400} ${size}px ${MONO}`; g.letterSpacing = "0px"; g.fillStyle = sp.color; g.textAlign = "left"; g.globalAlpha = A;
      g.fillText(t, cx, yy); cx += g.measureText(t).width;
      if (used >= cols) break;
    }
  }
  g.restore();
}
const short = (a, n = 6) => `${a.slice(0, n)}…${a.slice(-n)}`;
const e9 = (v) => (v * 1e9).toFixed(2);
let A = 1, D = null, PAGE = null;

// ---------------------------------------------------------------------------------------- scenes
// Cut 2 (12 Oct): the result inside the first 30 seconds, one scene per judging criterion, paced for

const P_ = () => D.dump.points;
/** The sell-out chart: execution price of every sell against the share sold, with the floor. */

  for (let v = 0; v <= yMax; v += 5e-9) { line(box.l, Y(v), box.r, Y(v), RULE, 1); tx((v * 1e9).toFixed(0), box.l - 14, Y(v) + 7, 20 * fs, MUTED, { mono: true, align: "right" }); }
  tx("price, ×10⁻⁹ SOL per token", box.l - 60, box.t - 26, 20 * fs, MUTED, { mono: true });
  for (let k = 0; k <= 100; k += 25) tx(`${k}%`, X(k), box.b + 36 * fs, 20 * fs, MUTED, { mono: true, align: "center" });
  tx("share of holders' tokens sold", (box.l + box.r) / 2, box.b + 76 * fs, 20 * fs, MUTED, { mono: true, align: "center" });
  const fNow = shown ? P[shown - 1].f : d.fAtOpenSolPerToken;
  g.globalAlpha = A; g.strokeStyle = INK; g.lineWidth = 6; g.beginPath(); g.moveTo(box.l, Y(d.fAtOpenSolPerToken)); for (let i = 0; i < shown; i++) g.lineTo(X(P[i].soldPct), Y(P[i].f)); g.lineTo(box.r, Y(fNow)); g.stroke();
  tx("FLOOR F", box.r + 18, Y(fNow) - 4, 26 * fs, INK, { weight: 700 }); tx(`${e9(fNow)} ×10⁻⁹`, box.r + 18, Y(fNow) + 24 * fs, 20 * fs, MUTED, { mono: true });
  g.globalAlpha = A; g.strokeStyle = MUTED; g.lineWidth = 2; g.beginPath(); for (let i = 0; i < shown; i++) { const x = X(P[i].soldPct), y = Y(P[i].price); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
  const r = 7 * fs;
  for (let i = 0; i < shown; i++) {
    const q2 = P[i], x = X(q2.soldPct), y = Y(q2.price), isBid = q2.venue === "DLMM bid";
    g.fillStyle = BG; g.beginPath(); isBid ? g.rect(x - r - 2, y - r - 2, 2 * r + 4, 2 * r + 4) : g.arc(x, y, r + 2, 0, 7); g.fill();
    g.fillStyle = isBid ? TEAL : BLUE; g.beginPath(); isBid ? g.rect(x - r + 1, y - r + 1, 2 * r - 2, 2 * r - 2) : g.arc(x, y, r, 0, 7); g.fill();
  }
  let lx = box.l; const ly = box.b + 126 * fs;
  g.fillStyle = BLUE; g.beginPath(); g.arc(lx + 7, ly - 7, 7, 0, 7); g.fill(); tx("sold to DAMM v2", lx + 24, ly, 22 * fs, INK); lx += 230 * fs;
  g.fillStyle = TEAL; g.fillRect(lx, ly - 13, 12, 12); tx("sold to the DLMM bid", lx + 24, ly, 22 * fs, INK); lx += 280 * fs;
  g.fillStyle = INK; g.fillRect(lx, ly - 10, 36, 6); tx("floor F", lx + 48, ly, 22 * fs, INK);
}
function resultBox(x, y, a) {

  faded(a, () => rect(x, y, 560, 232, "#1a1a18", TEAL, 2));
  tx("WORST FILL OF THE WHOLE SELL-OUT", x + 28, y + 46, 20, MUTED, { mono: true, spacing: "1.5px", alpha: a });

  tx("fees included", x + 28, y + 160, 24, MUTED, { alpha: a });
  tx(`fills on the bid: ${d.lowestBidFillOverF.toFixed(4)} × F or better`, x + 28, y + 200, 21, INK, { mono: true, alpha: a });
}

function hook(u) {

  wrap("of the newest tokens that graduated from Meteora's bonding curve locked none of their liquidity.", 220, 680, 56, INK, 1500, 72, { weight: 500, alpha: seg(u, 0.15, 0.35) });
  tx(`MEASURED ON MAINNET WITH  ballast scan  ·  ${D.scan.date.toUpperCase()}`, 220, 880, 24, MUTED, { mono: true, alpha: seg(u, 0.4, 0.6), spacing: "1.5px" });
}
function title(u) {
  g.globalAlpha = A * seg(u, 0, 0.15); g.fillStyle = ACCENT; g.fillRect(220, 300, 16, 30); g.fillStyle = INK; g.fillRect(220, 330, 16, 24); g.globalAlpha = A;
  tx("BALLAST", 262, 354, 60, INK, { weight: 800, spacing: "10px", alpha: seg(u, 0, 0.15) });
  tx("Launch with a floor.", 214, 570, 168, INK, { weight: 700, spacing: "-6px", alpha: seg(u, 0.05, 0.25) });
  tx("A Meteora launch whose worst case is computed on-chain", 220, 690, 44, MUTED, { alpha: seg(u, 0.2, 0.4) });
  tx("before the first public trade, and verifiable by anyone.", 220, 748, 44, MUTED, { alpha: seg(u, 0.2, 0.4) });
  tx("DBC  +  DAMM v2  +  DLMM", 220, 870, 30, BLUE, { mono: true, spacing: "3px", alpha: seg(u, 0.45, 0.65) });
}
function teaser(u) {

  tx("73 sells · each to the better of the DLMM bid and DAMM v2 · Meteora's mainnet binaries", 160, 244, 26, MUTED);
  tx("SUPPLY SOLD", 1790, 150, 22, MUTED, { mono: true, align: "right", spacing: "2px" });
  tx(`${(shown ? P[shown - 1].soldPct : 0).toFixed(0)}%`, 1790, 250, 112, INK, { weight: 700, align: "right", spacing: "-4px" });

function card(x, y, w, h, n, name, a) { faded(a, () => rect(x, y, w, h, PANEL, RULE)); tx(n, x + 28, y + 48, 22, BLUE, { mono: true, alpha: a }); tx(name, x + 76, y + 50, 34, INK, { weight: 700, alpha: a }); }
function mechanism(u) {
  const buys = D.sections.buy.lines.map(strip).filter((l) => /buyer \d/.test(l)).map((l) => ({ paid: Number(l.match(/paid\s+([\d.]+)/)[1]), pct: Number(l.match(/curve\s+([\d.]+)%/)[1]) }));
  const G = D.sections.graduate.lines.map(strip), FL = D.sections.floor.lines.map(strip);
  const pick = (arr, re) => (arr.find((l) => re.test(l)) ?? "").match(re)?.[1] ?? "";

  const p1 = pick(G, /Locked position 1\s+(\S+)/), p2 = pick(G, /Locked position 2\s+(\S+)/);

  const prog = buys.reduce((acc, b, i) => acc + (b.pct - (i ? buys[i - 1].pct : 0)) * ease(seg(u, 0.04 + i * 0.045, 0.085 + i * 0.045)), 0);
  g.globalAlpha = A * a1; g.fillStyle = "#2b2b29"; g.fillRect(128, 280, 504, 18); g.fillStyle = BLUE; g.fillRect(128, 280, 504 * prog / 100, 18); g.globalAlpha = A;
  tx(`${prog.toFixed(0)}%`, 632, 270, 24, INK, { mono: true, align: "right", alpha: a1 });
  buys.forEach((b, i) => { const s = seg(u, 0.05 + i * 0.045, 0.09 + i * 0.045); tx(`buyer ${i + 1}`, 128, 356 + i * 50, 28, MUTED, { alpha: s }); tx(`${b.paid.toFixed(3)} SOL`, 632, 356 + i * 50, 28, INK, { mono: true, align: "right", alpha: s }); });

function verify(u) {

    tx("LIVE ON MAINNET TODAY  ·  READ-ONLY  ·  ANY METEORA DAMM v2 POOL", 160, 200, 26, TEAL, { mono: true, spacing: "2px", alpha: b });
    tx("$ ballast check <pool> --cluster mainnet", 160, 290, 54, INK, { mono: true, weight: 700, alpha: b });
    D.mainnetCheck.forEach((c, i) => {
      const a = seg(u, 0.62 + i * 0.1, 0.7 + i * 0.1), y = 370 + i * 250, ok = c.result.includes("✓");
      faded(a, () => rect(160, y, 1600, 210, PANEL, ok ? TEAL : AMBER, 2));
      tx(`POOL ${"AB"[i]}  ·  a real pool from the mainnet scan`, 190, y + 46, 22, MUTED, { mono: true, spacing: "1.5px", alpha: a });
      tx(c.locked, 190, y + 96, 30, INK, { mono: true, alpha: a });
      g.font = `700 27px ${MONO}`; g.letterSpacing = "0px";
