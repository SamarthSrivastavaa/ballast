[package]
name = "ballast-floor"
description = "The only implementation of the Ballast floor F (BUILD_SPEC.md §4, §11)."
version.workspace = true
edition.workspace = true
# NOT the host pin. This crate is compiled for SBF by platform-tools rustc (1.79.0 in
# platform-tools v1.43), so its MSRV must be low enough for that compiler -- otherwise
# cargo build-sbf refuses before it even starts (D-002 condition 3). The host toolchain
# pin lives in rust-toolchain.toml and is deliberately higher.
rust-version = "1.79"
license.workspace = true

[dependencies]
# §11: U256 from ruint, no_std, no allocation.
ruint = { workspace = true }

[dev-dependencies]
proptest = "=1.5.0"
# Pinned down: proptest pulls getrandom, whose 0.4.x needs edition2024 (Rust 1.85+).
getrandom = "=0.2.15"
serde_json = "=1.0.133"

[features]
default = []
# Opt-in std, for the differential test harness and the verifier CLI only. The crate itself
# is no_std and the program links it without this.
std = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# §4: no silent wrapping, no unwrap in library code, no float.
arithmetic_side_effects = "warn"
float_arithmetic = "deny"
