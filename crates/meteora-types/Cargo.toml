[package]
name = "meteora-types"
description = "Vendored zero-copy layouts of the deployed Meteora DBC, DAMM v2 and DLMM accounts, generated from their IDLs and proven against real account bytes (Q12)."
version.workspace = true
edition.workspace = true
license.workspace = true
# Compiled for SBF by platform-tools rustc 1.79 when programs/ballast reads these accounts (Finding T1).
rust-version = "1.79"

[dependencies]
bytemuck = { version = "1.16", default-features = false, features = ["derive", "min_const_generics"] }

[dev-dependencies]
serde_json = "1"
